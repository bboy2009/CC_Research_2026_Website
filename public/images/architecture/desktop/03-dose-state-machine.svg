<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" font-family="Inter, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif">
      <defs>
        <marker id="d3-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#587D7D"></path></marker>
        <marker id="d3-arwo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C77D24"></path></marker>
      </defs>
      <rect x="0" y="0" width="1800" height="1000" fill="#F5F2EA"></rect>
      <text x="60" y="76" font-size="46" font-weight="600" fill="#222222">Dose state machine</text>
      <text x="60" y="118" font-size="21" fill="#666666">One ScheduledDose from creation to a terminal outcome. Orange states are exceptions requiring resolution.</text>

      <rect x="70" y="190" width="390" height="130" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="1.8"></rect>
      <text x="265" y="245" font-size="24" font-weight="600" fill="#222222" text-anchor="middle">SCHEDULED</text>
      <text x="265" y="280" font-size="19" fill="#666666" text-anchor="middle">Awaiting its due time</text>
      <line x1="460" y1="255" x2="476" y2="255" stroke="#587D7D" stroke-width="1.8" marker-end="url(#d3-arw)"></line>

      <rect x="480" y="190" width="390" height="130" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="1.8"></rect>
      <text x="675" y="245" font-size="24" font-weight="600" fill="#222222" text-anchor="middle">PREPARING</text>
      <text x="675" y="280" font-size="19" fill="#666666" text-anchor="middle">Preconditions validated</text>
      <line x1="870" y1="255" x2="886" y2="255" stroke="#587D7D" stroke-width="1.8" marker-end="url(#d3-arw)"></line>

      <rect x="890" y="190" width="390" height="130" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="1.8"></rect>
      <text x="1085" y="245" font-size="24" font-weight="600" fill="#222222" text-anchor="middle">POSITIONING_INSPECTION</text>
      <text x="1085" y="280" font-size="19" fill="#666666" text-anchor="middle">Carrier moves to the camera</text>
      <line x1="1280" y1="255" x2="1296" y2="255" stroke="#587D7D" stroke-width="1.8" marker-end="url(#d3-arw)"></line>

      <rect x="1300" y="190" width="390" height="130" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="1.8"></rect>
      <text x="1495" y="245" font-size="24" font-weight="600" fill="#222222" text-anchor="middle">INSPECTING</text>
      <text x="1495" y="280" font-size="19" fill="#666666" text-anchor="middle">Content verification active</text>

      <path d="M 1495 320 L 1495 380 L 265 380 L 265 436" fill="none" stroke="#587D7D" stroke-width="1.8" marker-end="url(#d3-arw)"></path>
      <text x="880" y="366" font-size="18" fill="#587D7D" text-anchor="middle">expected contents matched</text>

      <rect x="70" y="440" width="390" height="130" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="1.8"></rect>
      <text x="265" y="495" font-size="24" font-weight="600" fill="#222222" text-anchor="middle">VERIFIED</text>
      <text x="265" y="530" font-size="19" fill="#666666" text-anchor="middle">Passed acceptance thresholds</text>
      <line x1="460" y1="505" x2="476" y2="505" stroke="#587D7D" stroke-width="1.8" marker-end="url(#d3-arw)"></line>

      <rect x="480" y="440" width="390" height="130" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="1.8"></rect>
      <text x="675" y="495" font-size="24" font-weight="600" fill="#222222" text-anchor="middle">POSITIONING_HANDOFF</text>
      <text x="675" y="530" font-size="19" fill="#666666" text-anchor="middle">Same compartment moves</text>
      <line x1="870" y1="505" x2="886" y2="505" stroke="#587D7D" stroke-width="1.8" marker-end="url(#d3-arw)"></line>

      <rect x="890" y="440" width="390" height="130" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="1.8"></rect>
      <text x="1085" y="495" font-size="24" font-weight="600" fill="#222222" text-anchor="middle">READY_FOR_PICKUP</text>
      <text x="1085" y="530" font-size="19" fill="#666666" text-anchor="middle">Presented; rotation inhibited</text>
      <line x1="1280" y1="505" x2="1296" y2="505" stroke="#587D7D" stroke-width="1.8" marker-end="url(#d3-arw)"></line>

      <rect x="1300" y="440" width="390" height="130" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="1.8"></rect>
      <text x="1495" y="495" font-size="24" font-weight="600" fill="#222222" text-anchor="middle">COLLECTED</text>
      <text x="1495" y="530" font-size="19" fill="#666666" text-anchor="middle">Positive removal evidence</text>

      <line x1="1495" y1="320" x2="1495" y2="696" stroke="#C77D24" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#d3-arwo)"></line>
      <text x="1515" y="640" font-size="18" fill="#C77D24">verification failed</text>
      <line x1="1085" y1="570" x2="1085" y2="696" stroke="#C77D24" stroke-width="1.8" marker-end="url(#d3-arwo)"></line>
      <text x="1105" y="640" font-size="18" fill="#C77D24">window expired</text>
      <line x1="675" y1="570" x2="675" y2="696" stroke="#C77D24" stroke-width="1.8" marker-end="url(#d3-arwo)"></line>
      <text x="695" y="640" font-size="18" fill="#C77D24">presence unclear</text>
      <line x1="265" y1="570" x2="265" y2="696" stroke="#C77D24" stroke-width="1.8" marker-end="url(#d3-arwo)"></line>
      <text x="285" y="640" font-size="18" fill="#C77D24">safe failure</text>

      <rect x="70" y="700" width="390" height="130" rx="10" fill="#FFFFFF" stroke="#C77D24" stroke-width="1.8"></rect>
      <text x="265" y="755" font-size="24" font-weight="600" fill="#222222" text-anchor="middle">FAILED</text>
      <text x="265" y="790" font-size="19" fill="#666666" text-anchor="middle">Hardware or software fault</text>

      <rect x="480" y="700" width="390" height="130" rx="10" fill="#FFFFFF" stroke="#C77D24" stroke-width="1.8"></rect>
      <text x="675" y="755" font-size="24" font-weight="600" fill="#222222" text-anchor="middle">AMBIGUOUS_PICKUP</text>
      <text x="675" y="790" font-size="19" fill="#666666" text-anchor="middle">Removal undetermined</text>

      <rect x="890" y="700" width="390" height="130" rx="10" fill="#FFFFFF" stroke="#C77D24" stroke-width="1.8"></rect>
      <text x="1085" y="755" font-size="24" font-weight="600" fill="#222222" text-anchor="middle">NOT_COLLECTED</text>
      <text x="1085" y="790" font-size="19" fill="#666666" text-anchor="middle">Still present at expiry</text>

      <rect x="1300" y="700" width="390" height="130" rx="10" fill="#FFFFFF" stroke="#C77D24" stroke-width="1.8"></rect>
      <text x="1495" y="755" font-size="24" font-weight="600" fill="#222222" text-anchor="middle">BLOCKED</text>
      <text x="1495" y="790" font-size="19" fill="#666666" text-anchor="middle">Presentation prevented</text>

      <text x="70" y="910" font-size="19" fill="#666666">Terminal exception states are cleared only by caregiver action or an authorized, recorded override.</text>
    </svg>