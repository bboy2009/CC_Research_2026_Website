<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1150" viewBox="0 0 780 1150" font-family="Inter, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif">
      <defs>
        <marker id="m4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#587D7D"></path></marker>
        <marker id="m4-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C77D24"></path></marker>
      </defs>
      <rect x="0" y="0" width="780" height="1150" fill="#F5F2EA"></rect>
      <text x="40" y="72" font-size="36" font-weight="600" fill="#222222">Firmware states</text>
      <text x="40" y="108" font-size="19" fill="#666666">The controller owns position certainty.</text>

      <rect x="40" y="150" width="700" height="96" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="190" font-size="24" font-weight="600" fill="#222222">POWER_ON</text>
      <text x="68" y="220" font-size="18" fill="#666666">Motion inhibited until reference is set</text>
      <line x1="390" y1="246" x2="390" y2="276" stroke="#587D7D" stroke-width="2" marker-end="url(#m4-a)"></line>

      <rect x="40" y="280" width="700" height="96" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="320" font-size="24" font-weight="600" fill="#222222">HOMING</text>
      <text x="68" y="350" font-size="18" fill="#666666">Finding the physical HOME sensor</text>
      <line x1="390" y1="376" x2="390" y2="406" stroke="#587D7D" stroke-width="2" marker-end="url(#m4-a)"></line>

      <rect x="40" y="410" width="700" height="96" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="450" font-size="24" font-weight="600" fill="#222222">READY</text>
      <text x="68" y="480" font-size="18" fill="#666666">Known station index, safe hand-off</text>
      <line x1="390" y1="506" x2="390" y2="536" stroke="#587D7D" stroke-width="2" marker-end="url(#m4-a)"></line>

      <rect x="40" y="540" width="700" height="96" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="580" font-size="24" font-weight="600" fill="#222222">MOVING</text>
      <text x="68" y="610" font-size="18" fill="#666666">Rotation active, timeout enforced</text>
      <line x1="390" y1="636" x2="390" y2="666" stroke="#587D7D" stroke-width="2" marker-end="url(#m4-a)"></line>

      <rect x="40" y="670" width="700" height="96" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="710" font-size="24" font-weight="600" fill="#222222">HANDOFF_WAIT</text>
      <text x="68" y="740" font-size="18" fill="#666666">Waits for a safe removal or presence state</text>
      <line x1="390" y1="766" x2="390" y2="796" stroke="#C77D24" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#m4-o)"></line>
      <text x="406" y="790" font-size="17" fill="#C77D24">any unsafe or unknown condition</text>

      <rect x="40" y="800" width="700" height="96" rx="10" fill="#FFFFFF" stroke="#C77D24" stroke-width="2"></rect>
      <text x="68" y="840" font-size="24" font-weight="600" fill="#222222">FAULT</text>
      <text x="68" y="870" font-size="18" fill="#666666">Non-moving; commands rejected until re-homed</text>

      <rect x="40" y="930" width="700" height="170" rx="10" fill="#EAE5D9" stroke="rgba(0,0,0,0.08)"></rect>
      <text x="68" y="978" font-size="21" font-weight="600" fill="#343434">Serial commands</text>
      <text x="68" y="1014" font-size="18" fill="#666666">HOME · MOVE_TO_INSPECTION · MOVE_TO_HANDOFF</text>
      <text x="68" y="1042" font-size="18" fill="#666666">LIGHT_ON / OFF · GET_STATUS · RESET / RECOVER</text>
      <text x="68" y="1070" font-size="18" fill="#666666">Answered with ACK, status, DONE or ERROR.</text>
    </svg>