<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1120" viewBox="0 0 780 1120" font-family="Inter, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif">
      <rect x="0" y="0" width="780" height="1120" fill="#F5F2EA"></rect>
      <text x="40" y="72" font-size="36" font-weight="600" fill="#222222">Domain model</text>
      <text x="40" y="108" font-size="19" fill="#666666">Four clusters of entities in SQLite.</text>

      <rect x="40" y="150" width="700" height="180" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="194" font-size="24" font-weight="600" fill="#222222">Scheduling</text>
      <text x="68" y="230" font-size="19" fill="#666666">Patient → Schedule → ScheduledDose</text>
      <text x="68" y="266" font-size="18" fill="#666666">Timezone-aware patterns; a schedule names a</text>
      <text x="68" y="292" font-size="18" fill="#666666">medication and quantity, never a compartment.</text>

      <rect x="40" y="360" width="700" height="180" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="404" font-size="24" font-weight="600" fill="#222222">Physical inventory</text>
      <text x="68" y="440" font-size="19" fill="#666666">RemovableCompartment · CompartmentMedication</text>
      <text x="68" y="476" font-size="18" fill="#666666">Physical ID and carrier station stay separate</text>
      <text x="68" y="502" font-size="18" fill="#666666">fields; Medication is the canonical identity.</text>

      <rect x="40" y="570" width="700" height="180" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="614" font-size="24" font-weight="600" fill="#222222">Evidence</text>
      <text x="68" y="650" font-size="19" fill="#666666">InspectionEvent → PresentationEvent → PickupEvent</text>
      <text x="68" y="686" font-size="18" fill="#666666">Verification result, presentation record and</text>
      <text x="68" y="712" font-size="18" fill="#666666">collected / not collected / ambiguous outcome.</text>

      <rect x="40" y="780" width="700" height="180" rx="10" fill="#EAE5D9" stroke="rgba(0,0,0,0.08)"></rect>
      <text x="68" y="824" font-size="24" font-weight="600" fill="#343434">Cross-cutting</text>
      <text x="68" y="860" font-size="19" fill="#666666">Alert / Notification · SystemEvent</text>
      <text x="68" y="896" font-size="18" fill="#666666">User-facing exceptions with delivery state, plus</text>
      <text x="68" y="922" font-size="18" fill="#666666">the auditable history of every transition.</text>

      <text x="40" y="1020" font-size="18" fill="#666666">Logical identity is never derived from angular</text>
      <text x="40" y="1046" font-size="18" fill="#666666">position, and a mid-cycle schedule change cannot</text>
      <text x="40" y="1072" font-size="18" fill="#666666">silently alter what is already loaded.</text>
    </svg>