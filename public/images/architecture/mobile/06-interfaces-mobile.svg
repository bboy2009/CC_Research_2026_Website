<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1240" viewBox="0 0 780 1240" font-family="Inter, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif">
      <rect x="0" y="0" width="780" height="1240" fill="#F5F2EA"></rect>
      <text x="40" y="72" font-size="36" font-weight="600" fill="#222222">Interfaces</text>
      <text x="40" y="108" font-size="19" fill="#666666">Producer → consumer, with what crosses.</text>

      <rect x="40" y="150" width="700" height="120" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="192" font-size="22" font-weight="600" fill="#222222">Browser UI → Python API</text>
      <text x="68" y="224" font-size="18" fill="#666666">HTTP: medications, schedules, compartment</text>
      <text x="68" y="250" font-size="18" fill="#666666">states, pickup actions, alerts</text>

      <rect x="40" y="286" width="700" height="94" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="328" font-size="22" font-weight="600" fill="#222222">Workflows → Scheduler</text>
      <text x="68" y="358" font-size="18" fill="#666666">Due-dose query, schedule validation</text>

      <rect x="40" y="396" width="700" height="120" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="438" font-size="22" font-weight="600" fill="#222222">Workflows → Compartments</text>
      <text x="68" y="470" font-size="18" fill="#666666">Identity, presence, station, expected and</text>
      <text x="68" y="496" font-size="18" fill="#666666">loaded contents</text>

      <rect x="40" y="532" width="700" height="120" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="574" font-size="22" font-weight="600" fill="#222222">Workflows → Vision</text>
      <text x="68" y="606" font-size="18" fill="#666666">Inspection image plus expected contents, or</text>
      <text x="68" y="632" font-size="18" fill="#666666">a presence-classification request</text>

      <rect x="40" y="668" width="700" height="94" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="710" font-size="22" font-weight="600" fill="#222222">Camera → Vision</text>
      <text x="68" y="740" font-size="18" fill="#666666">Captured image at the fixed inspection pose</text>

      <rect x="40" y="778" width="700" height="120" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="820" font-size="22" font-weight="600" fill="#222222">Device Service → Arduino</text>
      <text x="68" y="852" font-size="18" fill="#666666">Serial: home, move-to-inspection,</text>
      <text x="68" y="878" font-size="18" fill="#666666">move-to-handoff, light, status, recover</text>

      <rect x="40" y="914" width="700" height="120" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="956" font-size="22" font-weight="600" fill="#222222">Arduino → Device Service</text>
      <text x="68" y="988" font-size="18" fill="#666666">ACK / status / DONE / ERROR, station index,</text>
      <text x="68" y="1014" font-size="18" fill="#666666">interlock and presence state</text>

      <rect x="40" y="1050" width="700" height="94" rx="10" fill="#FFFFFF" stroke="#587D7D" stroke-width="2"></rect>
      <text x="68" y="1092" font-size="22" font-weight="600" fill="#222222">Sensors → Arduino</text>
      <text x="68" y="1122" font-size="18" fill="#666666">Physical reference and safe-presence state</text>

      <text x="40" y="1196" font-size="18" fill="#666666">The host never generates individual step pulses.</text>
    </svg>